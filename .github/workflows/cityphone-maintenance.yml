name: CityPhone Maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cityphone-maintenance.yml'
  workflow_dispatch:

jobs:
  run-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Apply pending inventory maintenance
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            'https://yftaloxtylijudnoewrm.supabase.co/functions/v1/cityphone-maintenance'
