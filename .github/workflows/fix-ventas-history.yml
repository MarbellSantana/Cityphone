name: Fix ventas history

on:
  push:
    paths:
      - '.github/workflows/fix-ventas-history.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Quitar límite de 20 ventas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/ventas/page.tsx')
          s = p.read_text()
          old = 'const recentSales=useMemo(()=>[...sales].sort((a,b)=>new Date(b.createdAt).getTime()-new Date(a.createdAt).getTime()).slice(0,20),[sales]);'
          new = 'const recentSales=useMemo(()=>[...sales].sort((a,b)=>new Date(b.createdAt).getTime()-new Date(a.createdAt).getTime()),[sales]);'
          if old not in s:
              raise SystemExit('No se encontró el límite esperado')
          s = s.replace(old, new)
          s = s.replace('<p>Últimas 20 ventas registradas.</p>', '<p>Historial completo de ventas registradas.</p>')
          p.write_text(s)
          PY
      - name: Guardar corrección
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/ventas/page.tsx
          git commit -m 'Mostrar historial completo de ventas'
          git push origin main
